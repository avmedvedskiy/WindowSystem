name: Publish signed Unity UPM package to npm

on:
  workflow_dispatch:
  release:
    types: [published]

env:
  # Если package.json лежит в корне репозитория — оставь "."
  # Если пакет лежит в Packages/com.company.package — укажи этот путь
  PACKAGE_PATH: "."
  OUTPUT_PATH: "dist"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          registry-url: "https://registry.npmjs.org/"

      # Если у тебя реально нужны зависимости/сборка — оставь.
      # Если это чистый Unity package без build-шага, можно удалить.
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Unity UPM CLI
        run: |
          curl -fsSL https://cdn.packages.unity.com/upm-cli/install.sh | bash
          source ~/.bashrc || true
          upm --version

      - name: Pack and sign Unity package
        env:
          UPM_SERVICE_ACCOUNT_KEY_ID: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_ID }}
          UPM_SERVICE_ACCOUNT_KEY_SECRET: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_SECRET }}
          UNITY_ORGANIZATION_ID: ${{ secrets.UNITY_ORGANIZATION_ID }}
        run: |
          set -euo pipefail

          mkdir -p "$OUTPUT_PATH"

          upm pack "$PACKAGE_PATH" \
            --organization-id "$UNITY_ORGANIZATION_ID" \
            --destination "$OUTPUT_PATH"

          echo "Created package:"
          ls -la "$OUTPUT_PATH"

          echo "Verify signature file exists:"
          tar -tf "$OUTPUT_PATH"/*.tgz | grep -E '^package/\.attestation\.p7m$'

      - name: Publish signed package to npm
        run: npm publish "$OUTPUT_PATH"/*.tgz --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}